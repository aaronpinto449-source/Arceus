services:
  - type: web
    name: ares-mars-mission-control
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && npm install -g pnpm && pnpm --prefix frontend-svelte install && pnpm --prefix frontend-svelte build"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
